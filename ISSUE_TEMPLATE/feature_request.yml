name: 💡 Proposer une fonctionnalité
description: Proposer une nouvelle fonctionnalité ou une évolution
title: "[Feature] "
labels: [enhancement]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de proposer une évolution ! Vérifiez d'abord qu'une issue n'existe pas déjà pour cette idée.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrivez la fonctionnalité souhaitée et le problème qu'elle résout.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Comment la fonctionnalité devrait-elle se comporter ? Une liste numérotée est la bienvenue.
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Résultat actuel
      description: Ce qui se passe aujourd'hui, sans cette fonctionnalité.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code de conduite
      description: En ouvrant cette issue, vous acceptez de respecter le [code de conduite](https://github.com/aust-1/.github/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: J'accepte de respecter le code de conduite de ce projet
          required: true
