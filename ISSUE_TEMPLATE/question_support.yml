name: ❓ Question ou demande d'aide
description: Poser une question ou demander de l'aide pour utiliser le projet
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de poser votre question ! Consultez d'abord le `README.md` du dépôt et les issues existantes.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Décrivez votre question ou l'aide dont vous avez besoin.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Ce que vous avez déjà essayé, et tout détail utile (version, environnement…).
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code de conduite
      description: En ouvrant cette issue, vous acceptez de respecter le [code de conduite](https://github.com/aust-1/.github/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: J'accepte de respecter le code de conduite de ce projet
          required: true
