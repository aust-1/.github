name: 🐛 Signaler un bug
description: Signaler un comportement inattendu et reproductible
title: "[Bug] "
labels: [bug]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug ! Vérifiez d'abord qu'une issue n'existe pas déjà pour ce problème.

        Pour une faille de sécurité, **n'ouvrez pas d'issue publique** : suivez la [politique de sécurité](https://github.com/aust-1/.github/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrivez le problème rencontré et dans quel contexte il apparaît.
      placeholder: En exportant une playlist privée, la page de résultats reste vide…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire le bug
      description: Listez les étapes qui permettent d'observer le problème.
      placeholder: |
        1. Ouvrir …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
      description: Ce qui devrait se passer.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Résultat actuel
      description: Ce qui se passe réellement (message d'erreur, capture d'écran…).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version ou commit
      description: Version, tag ou commit utilisé, si vous le connaissez.
      placeholder: ex. v1.2.3 ou 8712ea4
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Système d'exploitation, navigateur, version du langage ou de l'environnement d'exécution…
      placeholder: ex. Ubuntu 24.04, Firefox 133, Python 3.12
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Journaux
      description: Copiez ici les journaux utiles. Ils seront automatiquement mis en forme comme du code, inutile d'ajouter des backticks.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code de conduite
      description: En ouvrant cette issue, vous acceptez de respecter le [code de conduite](https://github.com/aust-1/.github/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: J'accepte de respecter le code de conduite de ce projet
          required: true
